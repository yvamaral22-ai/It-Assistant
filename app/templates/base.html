<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}IT Self-Service Assistant{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='img/xcmg-mark.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/brand.css') }}">
  {% block styles %}{% endblock %}
</head>
<body>
  <header class="topbar"><a href="/" class="brand"><img src="{{ url_for('static', path='img/xcmg-logo.svg') }}" alt="XCMG"><span>IT Self-Service Assistant</span></a><nav><a href="/admin/sessions">Histórico</a><a href="/admin/reports">Relatórios</a></nav></header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer>Autoatendimento local de TI · Não informe senhas ou dados sensíveis.</footer>
  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
