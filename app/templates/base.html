<!doctype html>
<html lang="pt-BR">
<head>

  <title>{% block title %}IT Self-Service Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="topbar"><a href="/" class="brand">IT <span>Self-Service</span> Assistant</a><a href="/admin/sessions">Histórico</a></header>

  <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
